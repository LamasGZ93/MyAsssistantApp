<ion-header>
  <ion-toolbar>
    <ion-title>Editar Perfil</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  <form [formGroup]="profileForm" (ngSubmit)="saveProfile()">

    <!-- Categoría: Cuenta -->
    <ion-list>
      <ion-list-header>
        <ion-label>Cuenta</ion-label>
      </ion-list-header>

      <ion-item>
        <ion-label position="floating">Nombre</ion-label>
        <ion-input formControlName="name"></ion-input>
      </ion-item>

      <ion-item>
        <ion-label position="floating">Email</ion-label>
        <ion-input formControlName="email" type="email"></ion-input>
      </ion-item>
    </ion-list>

    <!-- Categoría: Privacidad -->
    <ion-list>
      <ion-list-header>
        <ion-label>Privacidad</ion-label>
      </ion-list-header>

      <ion-item>
        <ion-label>Zona horaria</ion-label>
        <ion-select formControlName="timezone">
          <ion-select-option value="Europe/Madrid">Europe/Madrid</ion-select-option>
          <ion-select-option value="America/New_York">America/New_York</ion-select-option>
          <ion-select-option value="Asia/Tokyo">Asia/Tokyo</ion-select-option>
        </ion-select>
      </ion-item>
    </ion-list>

    <!-- Categoría: Apariencia -->
    <ion-list>
      <ion-list-header>
        <ion-label>Apariencia</ion-label>
      </ion-list-header>

      <ion-item>
        <ion-label>Estilo de interacción</ion-label>
        <ion-select formControlName="interactionStyle">
          <ion-select-option value="breve">Breve</ion-select-option>
          <ion-select-option value="detallado">Detallado</ion-select-option>
          <ion-select-option value="informal">Informal</ion-select-option>
        </ion-select>
      </ion-item>
    </ion-list>

    <!-- Categoría: Notificaciones y sonidos -->
    <ion-list>
      <ion-list-header>
        <ion-label>Notificaciones y sonidos</ion-label>
      </ion-list-header>

      <ion-item>
        <ion-label>Activar notificaciones</ion-label>
        <ion-toggle [(ngModel)]="notificationsEnabled" [ngModelOptions]="{standalone: true}" slot="end"></ion-toggle>
      </ion-item>

      <ion-item>
        <ion-label>Sonidos del asistente</ion-label>
        <ion-toggle [(ngModel)]="assistantSounds" [ngModelOptions]="{standalone: true}" slot="end"></ion-toggle>
      </ion-item>
    </ion-list>

    <!-- Botones -->
    <ion-button expand="full" type="submit" [disabled]="!profileForm.valid">Guardar</ion-button>
    <ion-button expand="full" fill="clear" (click)="cancel()">Cancelar</ion-button>

  </form>
</ion-content>
